name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # Esto se encarga de la caché de NPM (~/.npm)

      # 1. Instalar dependencias PRIMERO.
      # Esto elimina node_modules y lo recrea limpio.
      - name: Install dependencies
        run: npm ci

      # 2. Restaurar la caché de Nuxt y las imágenes DESPUÉS de npm ci.
      - name: Cache Nuxt & Images
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache/ipx
            node_modules/.cache/nuxt-og-image
            node_modules/.cache/vite
            node_modules/.cache/nitro      # <-- Caché de prerenderizado de Nitro (OG Images)
          # Usamos el SHA del commit para la key, obligando a crear una caché nueva si el build tiene éxito.
          key: ${{ runner.os }}-nuxt-${{ github.sha }}
          # El restore-key rescata la caché del último build exitoso.
          restore-keys: |
            ${{ runner.os }}-nuxt-

      - name: Cache IPX Images
        uses: actions/cache@v4
        with:
          path: .ipx-cache
          key: ${{ runner.os }}-ipx-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ipx-cache-


      - name: Generate Static Site
        run: |
          npm run generate
          mkdir -p .ipx-cache
          mkdir -p .output/public/_ipx
          cp -R .ipx-cache/* .output/public/_ipx/ 2>/dev/null || true
          cp -R .output/public/_ipx/* .ipx-cache/ 2>/dev/null || true
          touch .output/public/.nojekyll
        env:
          # Aumentamos la memoria de Node. Los runners de Ubuntu en GitHub tienen 7GB de RAM.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload Static Files Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public

  publish-docker:
    runs-on: ubuntu-latest
    needs: build-static
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Static Files
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-static
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Static Files
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: public-dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-dist
          force_orphan: true
