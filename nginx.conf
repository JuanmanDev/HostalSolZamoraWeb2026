server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at Traefik, so nginx sees plain http. Emit relative
    # Location headers so redirects never downgrade to http://.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/json application/ld+json application/javascript application/xml application/xml+rss application/atom+xml application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # One URL policy: no trailing slash (matches canonicals, hreflang, sitemap).
    rewrite ^/(.+)/$ /$1 permanent;

    # Legacy WordPress URLs → real 301s (instead of meta-refresh stubs)
    location = /habitaciones            { return 301 /galeria; }
    location = /sobre-nosotros-cercania { return 301 /sobre-nosotros; }
    location = /aviso-legal             { return 301 /terminos-y-condiciones; }
    location = /ifeza                   { return 301 /parking; }

    # The sitemap module emits an index; keep the conventional URL working.
    location = /sitemap.xml { return 301 /sitemap_index.xml; }

    location / {
        # Prerendered pages live at /<path>/index.html. Unknown paths must 404,
        # never fall back to the homepage (soft 404).
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Discovery files: serve if present, otherwise a real 404.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Markdown alternates (nuxt-ai-ready) and llms.txt
    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Fingerprinted build output and IPX images: safe to cache forever.
    location ^~ /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /_ipx/ {
        # IPX keeps the source extension (.jpg) even for f_webp output, so the
        # extension-based MIME type would be wrong.
        location ~ f_webp {
            types { }
            default_type image/webp;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /_fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Other static assets (stable filenames): long cache, not immutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
